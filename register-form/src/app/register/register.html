<div class="register-container">

  <h1>Registration Form</h1>

  <form (ngSubmit)="onSubmit()">

    <!-- Full Name -->
    <div class="form-group">
      <label>Full Name</label>

      <input
        type="text"
        name="fullName"
        [(ngModel)]="fullName"
        placeholder="Enter your full name"
        required
        pattern="^[A-Za-z ]+$"
        #nameInput="ngModel"
      >
    </div>


    <!-- Address -->
    <div class="form-group">
      <label>Address</label>

      <textarea
        name="address"
        [(ngModel)]="address"
        rows="4"
        placeholder="Enter your address"
        required>
      </textarea>
    </div>


    <!-- Gender -->
    <div class="form-group">

      <label>Gender</label>

      <div class="options">

        <label>
          <input
            type="radio"
            name="gender"
            value="Male"
            [(ngModel)]="gender"
          >
          Male
        </label>

        <label>
          <input
            type="radio"
            name="gender"
            value="Female"
            [(ngModel)]="gender"
          >
          Female
        </label>

        <label>
          <input
            type="radio"
            name="gender"
            value="Other"
            [(ngModel)]="gender"
          >
          Other
        </label>

      </div>

    </div>


    <!-- Hobbies -->
    <div class="form-group">

      <label>Hobbies</label>

      <div class="options">

        <label>
          <input
            type="checkbox"
            name="cricket"
            [(ngModel)]="hobbies.cricket"
          >
          Cricket
        </label>

        <label>
          <input
            type="checkbox"
            name="cooking"
            [(ngModel)]="hobbies.cooking"
          >
          Cooking
        </label>

        <label>
          <input
            type="checkbox"
            name="swimming"
            [(ngModel)]="hobbies.swimming"
          >
          Swimming
        </label>

      </div>

    </div>


    <!-- Country -->
    <div class="form-group">

      <label>Country</label>

      <select
        name="country"
        [(ngModel)]="country"
        required
      >

        <option value="">-- Select Country --</option>
        <option value="India">India</option>
        <option value="USA">USA</option>
        <option value="UK">UK</option>
        <option value="Canada">Canada</option>
        <option value="Australia">Australia</option>

      </select>

    </div>


    <!-- Photo -->
    <div class="form-group">

      <label>Photo</label>

      <input
        type="file"
        accept=".jpeg,.jpg,image/jpeg"
        (change)="onPhotoSelected($event)"
      >

    </div>


    <!-- Email -->
    <div class="form-group">

      <label>Email ID</label>

      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Enter your email"
        required
      >

    </div>


    <!-- Submit -->
    <button type="submit">
      Register
    </button>

  </form>

</div>
